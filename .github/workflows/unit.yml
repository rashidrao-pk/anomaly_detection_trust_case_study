name: Python unit checks

on:
  pull_request:
  push:
    branches: [main, refactor/python-scripts]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: python -m pip install numpy==1.26.3 Pillow PyYAML pytest
      - name: Compile Python modules
        run: python -m compileall -q src scripts
      - name: Run lightweight unit tests (without TensorFlow/PyTorch)
        run: PYTHONPATH=src:. python -m pytest -q
